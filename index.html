<script>

document.getElementById("y").textContent =
new Date().getFullYear();

// "Myth, worn into stone." — carve the kicker line in letter by
// letter on load, like a chisel striking each character into place,
// then it settles into a permanent engraved look (see .chisel-letter
// in styles.css).
(function(){
  var kicker = document.querySelector('.kicker');
  if (!kicker) return;
  var text = kicker.textContent;
  kicker.setAttribute('aria-label', text);
  kicker.textContent = '';
  Array.from(text).forEach(function(ch, i){
    var span = document.createElement('span');
    span.className = 'chisel-letter';
    span.setAttribute('aria-hidden', 'true');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (i * 32) + 'ms';
    kicker.appendChild(span);
  });
})();

// Renders the drop grid from products.json — this is the file the
// admin page writes to, so new designs show up here automatically,
// in whatever order they're arranged there. Also drives the hero tee,
// which now crossfades through design FRONTS only (no turn, no back).
fetch('/products.json?v=' + Date.now())
.then(function(res){ return res.json(); })
.then(function(data){
  document.getElementById('dropTitle').textContent = data.dropTitle || 'Drop';
  document.getElementById('dropTagline').textContent = data.dropTagline || '';

  var allProducts = data.products || [];
  var activeProducts = allProducts.filter(function(p){ return p.active !== false; });

  renderGrid(activeProducts);
  cycleHero(activeProducts.filter(function(p){ return p.frontImage; }));
})
.catch(function(err){
  console.error('Could not load products.json', err);
});

function renderGrid(products){
  var grid = document.getElementById('productGrid');

  if (products.length === 0) {
    grid.innerHTML = '<p class="empty-drop">New designs dropping soon.</p>';
    return;
  }

  products.forEach(function(p, i){
    var card = document.createElement('div');
    card.className = 'product';

    // previewFace lets a design default to showing the back on the
    // card (useful when every front looks the same). Rather than a
    // separate .flipped state, the two sources are simply swapped —
    // "resting" and "revealed" are then the same two slots for every
    // card, so one turn animation covers both cases.
    var showBackFirst = p.previewFace === 'back' && p.backImage;

    var restImage    = showBackFirst ? p.backImage  : p.frontImage;
    var revealImage  = showBackFirst ? p.frontImage : p.backImage;
    var restLabel    = showBackFirst ? ' — back'  : ' — front';
    var revealLabel  = showBackFirst ? ' — front' : ' — back';

    var imageHtml;
    if (p.frontImage) {
      // .turnable = has a second face worth revealing, so it gets the
      // turn on hover / focus / scroll-into-view.
      imageHtml =
        '<div class="product-image' + (revealImage ? ' turnable' : '') + '">' +
          '<div class="product-tee">' +
            '<img class="img-front" src="' + restImage + '" alt="' + escapeHtml(p.name) + restLabel + '">' +
            (revealImage ? '<img class="img-back" src="' + revealImage + '" alt="' + escapeHtml(p.name) + revealLabel + '">' : '') +
          '</div>' +
        '</div>';
    } else {
      imageHtml = '<div class="product-image no-image">Image coming soon</div>';
    }

    // Stagger each button's gleam so they never sweep in sync.
    var shineDelay = (i * 3.7) % 15;

    card.innerHTML =
      imageHtml +
      '<div class="product-info">' +
        (p.drop ? '<span class="product-drop">' + escapeHtml(p.drop) + '</span>' : '') +
        '<h3>' + escapeHtml(p.name) + '</h3>' +
        '<p class="desc">' + escapeHtml(p.desc || '') + '</p>' +
        '<div class="buy-row">' +
          '<a class="btn primary" style="--shine-delay:' + shineDelay + 's" href="' + p.buyUrl + '" target="_blank" rel="noopener">Buy Now — $' + p.price + '</a>' +
        '</div>' +
      '</div>';

    grid.appendChild(card);
  });

  setupAutoTurn(grid);
}

// Touch devices have no hover, so the card turn would be unreachable
// there. On those devices each card turns itself once as it scrolls
// into view, then settles back. Desktop keeps hover/focus only, so
// nothing moves unless the visitor points at it.
function setupAutoTurn(grid){
  var noHover = window.matchMedia('(hover: none)').matches ||
                window.matchMedia('(pointer: coarse)').matches;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!noHover || reduced || !('IntersectionObserver' in window)) return;

  var HOLD_MS = 2200; // how long the revealed face stays up

  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (!entry.isIntersecting) return;
      var card = entry.target;
      if (card.dataset.turning === '1') return;

      card.dataset.turning = '1';
      card.classList.add('is-turned');

      setTimeout(function(){
        card.classList.remove('is-turned');
        // Small cooldown so a card sitting on the fold doesn't
        // stutter in and out of the animation.
        setTimeout(function(){ card.dataset.turning = '0'; }, 800);
      }, HOLD_MS);
    });
  }, { threshold: 0.55 });

  grid.querySelectorAll('.product-image.turnable').forEach(function(el){
    observer.observe(el);
  });
}

// The hero tee no longer turns and never shows a back — it just
// crossfades through the FRONT of each active design. The image is
// faded out, swapped while it's invisible, then faded back in, so the
// swap itself is never seen.
//
// Want a single static front instead of a rotation? Delete the
// scheduleNext() call at the bottom of this function — the first
// design's front will simply stay up.
function cycleHero(products){
  var front = document.querySelector('.tee-front');
  if (!front || products.length === 0) return;

  var CYCLE_MS = 9000;  // time each design holds
  var FADE_MS  = 700;   // must match the .tee-front transition in styles.css
  var idx = 0;

  front.src = products[0].frontImage;

  function scheduleNext(){
    setTimeout(function(){
      idx = (idx + 1) % products.length;
      var nextSrc = products[idx].frontImage;

      // Preload so the fade-in never lands on a half-loaded image.
      var pre = new Image();
      pre.onload = pre.onerror = function(){
        front.classList.add('fading');
        setTimeout(function(){
          front.src = nextSrc;
          front.classList.remove('fading');
          scheduleNext();
        }, FADE_MS);
      };
      pre.src = nextSrc;
    }, CYCLE_MS);
  }

  if (products.length > 1) scheduleNext();
}

function escapeHtml(str){
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

</script>
