<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEITY — Ancient Myth, Modern Street</title>
    <meta
      name="description"
      content="DEITY — ancient gods translated into modern dark streetwear."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="grain"></div>

    <header class="wrap header header-glow">
      <!-- LOGO IMAGE -->
      <div class="brand-logo">
        <img src="./images/deity-logo.png" alt="DEITY Logo" />
      </div>

      <nav class="nav">
        <a class="nav-link" href="#drop">Drop</a>
        <a class="nav-link" href="#story">Story</a>
        <a class="nav-link" href="#contact">Contact</a>
      </nav>
    </header>

    <main class="wrap">
      <section class="hero" id="top">
        <div class="hero-left">
          <p class="kicker">Myth, worn into street.</p>
          <h1 class="title">DEITY</h1>

          <p class="sub">
            Ancient gods reintroduced as modern dark streetwear.
            Like influencers existed back then.
          </p>

          <div class="cta-row">
            <a class="btn primary rare" href="#drop">View the drop</a>
            <a class="btn ghost" href="#story">Brand story</a>
          </div>
        </div>

        <div class="hero-right">
          <div class="aura-card">
            <div class="column"></div>
            <div class="aura"></div>
            <div class="sigil">DEITY</div>
          </div>
        </div>
      </section>

      <section class="drop" id="drop">
        <div class="section-head">
          <h2>Drop 001</h2>
          <p>Ash faded black. Gold mark.</p>
        </div>

        <div class="product">
          <div class="product-media">
            <div class="mock"></div>
          </div>

          <div class="product-info">
            <h3>DEITY Tee — Ash / Gold</h3>

            <div class="buy-row">
              <a
                class="btn primary rare"
                href="https://example.com"
                target="_blank"
                rel="noopener"
              >
                Buy now
              </a>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <div>© <span id="y"></span> DEITY</div>
      </footer>
    </main>

    <script>
      document.getElementById("y").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
